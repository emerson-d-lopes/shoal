version: 2
updates:
  # ed25519-dalek and the hashing crates are the whole authentication
  # boundary, so a release there should open a PR the same day.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      crypto:
        patterns:
          - "ed25519-dalek"
          - "sha2"
          - "base64"
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
